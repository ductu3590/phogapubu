<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>short</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  .lien { width: 72mm; margin: 0 auto; color: #000;
          font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          font-size: 12px; line-height: 1.35; }
  .lien hr { border: none; border-top: 1px dashed #000; margin: 6px 0; }
  .row { display: flex; justify-content: space-between; gap: 6px; }
  .row .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .row .num { flex-shrink: 0; text-align: right; }
  .tieude { text-align: center; font-weight: 700; font-size: 15px; }
  .ban { text-align: center; font-weight: 700; font-size: 20px; margin: 4px 0; }
  .ghichu { font-style: italic; }
</style>
</head><body>
<div class="lien">
  <div class="tieude">Bia lẩu Bảo Lương</div>
  <div class="ban">Bàn 12</div>
  <hr>
  <div class="row"><span class="name">Bia hơi (Tháp)</span><span class="num">x1</span></div>
  <div class="row"><span class="name">Lẩu cá tầm măng chua</span><span class="num">x2</span></div>
  <div class="row"><span class="name">Đậu phụ rán giòn</span><span class="num">x3</span></div>
  <div class="ghichu">Ghi chú: ít cay, nhiều rau</div>
  <hr>
  <div style="text-align:center">Cảm ơn quý khách</div>
</div>
</body></html>
